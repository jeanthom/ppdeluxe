# Originally from scythe by husky (https://forge.voremicrocomputers.com/husky/scythe); modified for ppdeluxe.
[package]
name = "ppdeluxe"
version = "0.1.0"
edition = "2024"
authors = [
    "husky <nikocs@voremicrocomputers.com>",
    "Jean THOMAS <virgule@jeanthomas.me>",
]

[dependencies]
uart_16550 = "0.8.1"
embassy-shell = { version = "0.2.0", default-features = false }
embassy-futures = "0.1.2"
embedded-io-async = "0.7"
embedded-alloc = { version = "0.7.0", default-features = false, features = ["llff"] }
critical-section = { version = "1.2.0", features = ["restore-state-none"] }

[build-dependencies]
cc = "1.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
